; =============================================================================
; iNIM supervisord configuration
;
; Manages three processes:
;   1. nginx       — Reverse proxy (starts immediately)
;   2. orchestrator — Startup coordinator (starts immediately, exits after setup)
;   3. ovms        — OpenVINO Model Server (started by orchestrator via sentinel)
;
; Fail-fast behavior: any unexpected process exit causes container shutdown.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info
user=root

; =============================================================================
; Unix socket for supervisorctl commands
; =============================================================================
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; =============================================================================
; nginx — Reverse proxy
; Starts immediately, serves /v1/health/live right away
; =============================================================================
[program:nginx]
command=nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=10
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=10
stopsignal=QUIT

; =============================================================================
; iNIM Orchestrator — Startup coordinator
; Runs once, performs GPU detection + profile selection + model download +
; OVMS config generation, then exits 0
; =============================================================================
[program:orchestrator]
command=python3 -m inim.main
directory=/opt/inim
autostart=true
autorestart=false
priority=20
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=30
environment=PYTHONPATH="/opt/inim/src",PYTHONUNBUFFERED="1"

; =============================================================================
; OVMS — OpenVINO Model Server
; Started AFTER orchestrator writes sentinel file
; autostart=false: started by the entrypoint script's sentinel watcher
; =============================================================================
[program:ovms]
command=/opt/inim/scripts/start_ovms.sh
autostart=false
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=30
stopsignal=TERM

; =============================================================================
; Event listener for fail-fast behavior
; If any critical process exits unexpectedly, shut down the container
; =============================================================================
[eventlistener:exit_on_failure]
command=python3 /opt/inim/scripts/supervisor_exit_handler.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
autostart=true
autorestart=true
priority=1
