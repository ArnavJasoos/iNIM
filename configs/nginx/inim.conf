# iNIM nginx reverse proxy configuration
# Maps NIM-standard /v1/* routes to OVMS /v3/* backend routes
# Serves health/liveness directly without backend dependency

upstream ovms_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 8000;
    # TLS configuration is injected by entrypoint.sh when INIM_TLS_* vars are set

    # --- Request size limits ---
    client_max_body_size 100m;

    # --- Proxy defaults ---
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Distributed tracing header forwarding ---
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Traceparent $http_traceparent;

    # === CORS Configuration ===
    # Defaults to allow all origins; override with INIM_ALLOWED_ORIGINS
    # CORS headers are injected by entrypoint.sh

    # =========================================================================
    # Health Probes
    # =========================================================================

    # Liveness: served directly by nginx, no backend dependency
    # Returns 200 immediately even if OVMS is still loading
    location = /v1/health/live {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Readiness: proxy to OVMS health endpoint
    # Returns 503 until OVMS has loaded the model and is ready to serve
    location = /v1/health/ready {
        proxy_pass http://ovms_backend/v3/health/ready;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # =========================================================================
    # Inference Endpoints (OpenAI-compatible)
    # =========================================================================

    # Chat completions (primary endpoint for conversational LLMs)
    location /v1/chat/completions {
        proxy_pass http://ovms_backend/v3/chat/completions;
        proxy_buffering off;          # Required for SSE streaming
        proxy_cache off;
        proxy_read_timeout 300s;      # Long timeout for generation
        proxy_connect_timeout 10s;

        # SSE support
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;
    }

    # Text completions
    location /v1/completions {
        proxy_pass http://ovms_backend/v3/completions;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # SSE support
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;
    }

    # Embeddings
    location /v1/embeddings {
        proxy_pass http://ovms_backend/v3/embeddings;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # Management Endpoints
    # =========================================================================

    # Model listing
    location /v1/models {
        proxy_pass http://ovms_backend/v3/models;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # Observability
    # =========================================================================

    # Prometheus metrics (proxied from OVMS native /metrics)
    location /v1/metrics {
        proxy_pass http://ovms_backend/metrics;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # Security: reject all other paths
    # =========================================================================

    location / {
        default_type application/json;
        return 404 '{"error":"Not Found","message":"This endpoint does not exist. Available: /v1/chat/completions, /v1/completions, /v1/models, /v1/health/live, /v1/health/ready, /v1/metrics"}';
    }
}
